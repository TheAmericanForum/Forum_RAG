# Nightly data-integrity audit for the New Hampshire Forum (TENANT=nh).
#
# Runs the cheap layers of the test suite (tests/, minus the @pytest.mark.e2e full-agent
# layer — see pytest.ini) against the nh_chunks Qdrant collection: (a) every Drive
# transcript parses cleanly, (b) every Drive transcript is indexed and up to date
# (file-level, via forum_rag.sources.reconcile_sources) and has no turn-coverage gaps
# (chunk-level, via forum_rag.integrity.audit_chunk_coverage), (c) a realistic,
# transcript-grounded question actually retrieves that transcript via plain vector
# search (no Anthropic cost). A failing run shows red in the Actions tab, same as an
# ingest failure would.
#
# Scheduled to run after ingest-nh.yml (08:25 UTC) so it's checking that day's data.
#
# tests/fixtures/test_questions.<collection>.json is committed to git and is the durable
# cache of generated questions. Each row is keyed to its transcript's source_md5, so a
# question is regenerated only when that transcript is new or has been re-ingested (see
# generate_test_questions.py). The "Persist regenerated questions" step below commits any
# such additions back, so the next run reuses them instead of paying to regenerate — and
# the first run for a tenant bootstraps its fixture the same way.
#
# The full end-to-end agent layer (tests/test_retrieval_agent.py, real Anthropic
# retrieval-planner + synthesis calls) is intentionally NOT run here — trigger it
# on demand instead via the "E2E agent test - NH transcripts" workflow (e2e-nh.yml,
# workflow_dispatch only, no schedule).
#
# Required GitHub secrets: same as ingest-nh.yml (QDRANT_URL, QDRANT_API_KEY,
# OPENAI_API_KEY, ANTHROPIC_API_KEY, GOOGLE_SERVICE_ACCOUNT_JSON, DRIVE_FOLDER_IDS_NH)
name: Audit NH transcripts

on:
  schedule:
    - cron: "25 9 * * *" # daily 09:25 UTC (1h after ingest-nh)
  workflow_dispatch: {}

concurrency:
  group: audit-nh
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the refreshed test-question fixture back to the branch
    timeout-minutes: 30
    env:
      TENANT: nh
      QDRANT_COLLECTION: nh_chunks
      QDRANT_URL: ${{ secrets.QDRANT_URL }}
      QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      DRIVE_FOLDER_IDS: ${{ secrets.DRIVE_FOLDER_IDS_NH }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate questions for any new or re-ingested transcripts
        run: python generate_test_questions.py
      - name: Run integrity + retrieval-recall tests
        run: pytest tests/ -v
      - name: Persist regenerated questions back to git
        if: always() # persist even if the tests above failed; never block on a push race
        continue-on-error: true
        run: |
          set -uo pipefail
          FIXTURE="tests/fixtures/test_questions.${QDRANT_COLLECTION}.json"
          # --porcelain catches a brand-new (untracked) fixture too, which `git diff` would miss.
          if [ -z "$(git status --porcelain -- "$FIXTURE")" ]; then
            echo "No fixture changes to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$FIXTURE"
          git commit -m "chore(audit): cache generated test questions for ${QDRANT_COLLECTION} [skip ci]"
          # Rebase-retry so a concurrent tenant audit committing its own fixture can't lose this one.
          for attempt in 1 2 3; do
            if git fetch origin "$GITHUB_REF_NAME" \
               && git rebase "origin/$GITHUB_REF_NAME" \
               && git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Persisted fixture update."
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Attempt $attempt failed (likely a push race); retrying..."
            sleep $((RANDOM % 8 + 3))
          done
          echo "Could not persist fixture update after 3 attempts (will regenerate next run)." >&2
          exit 1
